<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .search-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .search-bar input {
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            width: 300px;
            font-size: 1em;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .search-bar input:focus {
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .search-bar button {
            padding: 12px 30px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .search-bar button:hover {
            background: #229954;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .search-bar button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .location-btn {
            padding: 12px 30px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .location-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .loading {
            text-align: center;
            color: white;
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .weather-content {
            display: none;
        }

        .current-weather {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .weather-main {
            text-align: center;
        }

        .weather-icon {
            font-size: 6em;
            margin: 20px 0;
        }

        .temperature {
            font-size: 3.5em;
            color: #667eea;
            font-weight: bold;
            margin: 20px 0;
        }

        .weather-description {
            font-size: 1.5em;
            color: #7f8c8d;
            text-transform: capitalize;
            margin-bottom: 20px;
        }

        .location-name {
            font-size: 1.8em;
            color: #2d3436;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .detail-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        .detail-label {
            color: #7f8c8d;
            font-size: 0.9em;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .detail-value {
            color: #667eea;
            font-size: 1.8em;
            font-weight: bold;
        }

        .hourly-forecast {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #2d3436;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .hourly-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .hourly-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            color: white;
            min-width: 120px;
            transition: all 0.3s ease;
        }

        .hourly-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .hourly-time {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .hourly-icon {
            font-size: 2em;
            margin: 8px 0;
        }

        .hourly-temp {
            font-size: 1.2em;
            font-weight: bold;
        }

        .forecast {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .forecast-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .forecast-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: white;
            transition: all 0.3s ease;
        }

        .forecast-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .forecast-date {
            font-size: 1em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .forecast-icon {
            font-size: 2.5em;
            margin: 10px 0;
        }

        .forecast-description {
            font-size: 0.9em;
            opacity: 0.9;
            text-transform: capitalize;
            margin-bottom: 10px;
        }

        .forecast-temps {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-weight: bold;
        }

        .forecast-high {
            color: #ffd93d;
        }

        .forecast-low {
            color: rgba(255, 255, 255, 0.7);
        }

        .units-toggle {
            text-align: center;
            margin-bottom: 20px;
        }

        .toggle-btn {
            background: white;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 0 5px;
        }

        .toggle-btn.active {
            background: #667eea;
            color: white;
        }

        .toggle-btn:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .current-weather {
                grid-template-columns: 1fr;
                padding: 20px;
                gap: 20px;
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .hourly-container {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }

            .forecast-container {
                grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            }

            .temperature {
                font-size: 2.5em;
            }

            .weather-icon {
                font-size: 4em;
            }
        }

        @media (max-width: 480px) {
            .search-bar input {
                width: 100%;
            }

            .current-weather {
                padding: 15px;
            }

            .weather-details {
                grid-template-columns: 1fr;
            }

            .temperature {
                font-size: 2em;
            }

            .header h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Get real-time weather information for any location</p>
        </div>

        <div class="units-toggle">
            <button class="toggle-btn active" onclick="setUnit('celsius')">°C Celsius</button>
            <button class="toggle-btn" onclick="setUnit('fahrenheit')">°F Fahrenheit</button>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Enter city name..." />
            <button onclick="searchWeather()">Search</button>
            <button class="location-btn" onclick="getCurrentLocation()">📍 My Location</button>
        </div>

        <div class="error" id="error"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>

        <div class="weather-content" id="weatherContent">
            <!-- Current Weather -->
            <div class="current-weather">
                <div class="weather-main">
                    <div class="location-name" id="locationName"></div>
                    <div class="weather-icon" id="weatherIcon"></div>
                    <div class="temperature" id="temperature"></div>
                    <div class="weather-description" id="weatherDescription"></div>
                </div>

                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value" id="feelsLike"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value" id="humidity"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value" id="windSpeed"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Pressure</div>
                        <div class="detail-value" id="pressure"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Visibility</div>
                        <div class="detail-value" id="visibility"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">UV Index</div>
                        <div class="detail-value" id="uvIndex"></div>
                    </div>
                </div>
            </div>

            <!-- Hourly Forecast -->
            <div class="hourly-forecast">
                <div class="section-title">Hourly Forecast</div>
                <div class="hourly-container" id="hourlyContainer"></div>
            </div>

            <!-- 5-Day Forecast -->
            <div class="forecast">
                <div class="section-title">5-Day Forecast</div>
                <div class="forecast-container" id="forecastContainer"></div>
            </div>
        </div>
    </div>

    <script>
        let currentUnit = 'celsius';
        let weatherData = null;
        let forecastData = null;
        const apiKey = '6d8fb5b93d4af21c66a2948710284366'; // OpenWeatherMap free API key

        // Weather icon mapping
        function getWeatherIcon(code) {
            const iconMap = {
                '01d': '☀️',
                '01n': '🌙',
                '02d': '⛅',
                '02n': '☁️',
                '03d': '☁️',
                '03n': '☁️',
                '04d': '☁️',
                '04n': '☁️',
                '09d': '🌧️',
                '09n': '🌧️',
                '10d': '🌧️',
                '10n': '🌧️',
                '11d': '⛈️',
                '11n': '⛈️',
                '13d': '❄️',
                '13n': '❄️',
                '50d': '🌫️',
                '50n': '🌫️'
            };
            return iconMap[code] || '🌤️';
        }

        // Convert temperature
        function convertTemp(kelvin) {
            if (currentUnit === 'celsius') {
                return Math.round(kelvin - 273.15);
            } else {
                return Math.round((kelvin - 273.15) * 9/5 + 32);
            }
        }

        // Get temperature unit
        function getTempUnit() {
            return currentUnit === 'celsius' ? '°C' : '°F';
        }

        // Fetch weather by city name
        async function searchWeather() {
            const city = document.getElementById('searchInput').value.trim();
            if (!city) {
                showError('Please enter a city name');
                return;
            }
            await fetchWeatherByCity(city);
        }

        // Fetch weather by coordinates
        async function fetchWeatherByCoordinates(lat, lon) {
            try {
                showLoading(true);
                hideError();

                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}`
                );

                if (!response.ok) {
                    throw new Error('Failed to fetch weather data');
                }

                weatherData = await response.json();

                // Fetch forecast data
                const forecastResponse = await fetch(
                    `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${apiKey}`
                );

                if (!forecastResponse.ok) {
                    throw new Error('Failed to fetch forecast data');
                }

                forecastData = await forecastResponse.json();

                displayWeather();
                showLoading(false);

            } catch (err) {
                console.error('Error fetching weather:', err);
                showError(err.message);
                showLoading(false);
            }
        }

        // Fetch weather by city
        async function fetchWeatherByCity(city) {
            try {
                showLoading(true);
                hideError();

                const response = await fetch(
                    `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}`
                );

                if (!response.ok) {
                    throw new Error('City not found');
                }

                weatherData = await response.json();

                // Fetch forecast data
                const forecastResponse = await fetch(
                    `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${apiKey}`
                );

                if (!forecastResponse.ok) {
                    throw new Error('Failed to fetch forecast data');
                }

                forecastData = await forecastResponse.json();

                displayWeather();
                showLoading(false);
                document.getElementById('searchInput').value = '';

            } catch (err) {
                console.error('Error fetching weather:', err);
                showError(err.message);
                showLoading(false);
            }
        }

        // Get user's current location
        function getCurrentLocation() {
            if (navigator.geolocation) {
                showLoading(true);
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        fetchWeatherByCoordinates(latitude, longitude);
                    },
                    (error) => {
                        showError('Unable to get your location. Please enable location access.');
                        showLoading(false);
                        console.error('Geolocation error:', error);
                    }
                );
            } else {
                showError('Geolocation is not supported by your browser');
            }
        }

        // Display current weather
        function displayWeather() {
            if (!weatherData) return;

            const temp = convertTemp(weatherData.main.temp);
            const feelsLike = convertTemp(weatherData.main.feels_like);
            const tempUnit = getTempUnit();

            // Update current weather
            document.getElementById('locationName').textContent = 
                `${weatherData.name}, ${weatherData.sys.country}`;
            document.getElementById('weatherIcon').textContent = 
                getWeatherIcon(weatherData.weather[0].icon);
            document.getElementById('temperature').textContent = `${temp}${tempUnit}`;
            document.getElementById('weatherDescription').textContent = 
                weatherData.weather[0].description;
            document.getElementById('feelsLike').textContent = `${feelsLike}${tempUnit}`;
            document.getElementById('humidity').textContent = `${weatherData.main.humidity}%`;
            document.getElementById('windSpeed').textContent = 
                `${Math.round(weatherData.wind.speed * 3.6)} km/h`;
            document.getElementById('pressure').textContent = `${weatherData.main.pressure} mb`;
            document.getElementById('visibility').textContent = 
                `${(weatherData.visibility / 1000).toFixed(1)} km`;
            document.getElementById('uvIndex').textContent = 
                weatherData.uvi !== undefined ? weatherData.uvi.toFixed(1) : 'N/A';

            // Display hourly forecast
            displayHourlyForecast();

            // Display 5-day forecast
            displayForecast();

            document.getElementById('weatherContent').style.display = 'block';
        }

        // Display hourly forecast
        function displayHourlyForecast() {
            if (!forecastData) return;

            const hourlyContainer = document.getElementById('hourlyContainer');
            hourlyContainer.innerHTML = '';

            const next24Hours = forecastData.list.slice(0, 8);

            next24Hours.forEach((hour) => {
                const date = new Date(hour.dt * 1000);
                const time = date.toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                });
                const temp = convertTemp(hour.main.temp);
                const tempUnit = getTempUnit();
                const icon = getWeatherIcon(hour.weather[0].icon);

                const hourlyItem = document.createElement('div');
                hourlyItem.className = 'hourly-item';
                hourlyItem.innerHTML = `
                    <div class="hourly-time">${time}</div>
                    <div class="hourly-icon">${icon}</div>
                    <div class="hourly-temp">${temp}${tempUnit}</div>
                `;
                hourlyContainer.appendChild(hourlyItem);
            });
        }

        // Display 5-day forecast
        function displayForecast() {
            if (!forecastData) return;

            const forecastContainer = document.getElementById('forecastContainer');
            forecastContainer.innerHTML = '';

            const dailyData = {};

            // Group forecast by day
            forecastData.list.forEach((item) => {
                const date = new Date(item.dt * 1000);
                const day = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

                if (!dailyData[day]) {
                    dailyData[day] = [];
                }
                dailyData[day].push(item);
            });

            // Create forecast cards for each day
            Object.entries(dailyData).slice(0, 5).forEach(([day, items]) => {
                const temps = items.map(item => convertTemp(item.main.temp));
                const maxTemp = Math.max(...temps);
                const minTemp = Math.min(...temps);
                const avgWeather = items[Math.floor(items.length / 2)].weather[0];
                const tempUnit = getTempUnit();

                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                    <div class="forecast-date">${day}</div>
                    <div class="forecast-icon">${getWeatherIcon(avgWeather.icon)}</div>
                    <div class="forecast-description">${avgWeather.description}</div>
                    <div class="forecast-temps">
                        <span class="forecast-high">${maxTemp}${tempUnit}</span>
                        <span class="forecast-low">${minTemp}${tempUnit}</span>
                    </div>
                `;
                forecastContainer.appendChild(forecastItem);
            });
        }

        // Set temperature unit
        function setUnit(unit) {
            currentUnit = unit;

            // Update active toggle button
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Refresh display if weather data exists
            if (weatherData) {
                displayWeather();
            }
        }

        // Show error message
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = `⚠️ ${message}`;
            errorEl.style.display = 'block';
        }

        // Hide error message
        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        // Show/hide loading
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Allow Enter key to search
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchWeather();
            }
        });

        // Load default city on page load
        window.addEventListener('load', () => {
            fetchWeatherByCity('London');
        });
    </script>
</body>
</html>
