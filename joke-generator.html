<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .joke-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .joke-text {
            color: white;
            font-size: 1.3em;
            text-align: center;
            line-height: 1.6;
            font-weight: 500;
        }

        .joke-punchline {
            color: #ffd93d;
            font-size: 1.1em;
            margin-top: 20px;
            font-style: italic;
            font-weight: bold;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 150px;
        }

        .get-joke-btn {
            background: #27ae60;
            color: white;
        }

        .get-joke-btn:hover {
            background: #229954;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }

        .get-joke-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .random-btn {
            background: #e74c3c;
            color: white;
        }

        .random-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .random-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .copy-btn {
            background: #3498db;
            color: white;
        }

        .copy-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .copy-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .joke-type {
            text-align: center;
            color: #95a5a6;
            font-size: 0.9em;
            margin-top: 15px;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .success-message {
            color: #27ae60;
            text-align: center;
            margin-top: 10px;
            font-size: 0.9em;
            display: none;
        }

        .joke-category {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .category-btn {
            padding: 8px 15px;
            background: #ecf0f1;
            border: 2px solid #bdc3c7;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9em;
            font-weight: 500;
        }

        .category-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .category-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .joke-text {
                font-size: 1.1em;
            }

            button {
                padding: 10px 20px;
                font-size: 1em;
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh with one click!</p>

        <div class="joke-category">
            <button class="category-btn active" onclick="setCategory('any')">Any</button>
            <button class="category-btn" onclick="setCategory('general')">General</button>
            <button class="category-btn" onclick="setCategory('programming')">Programming</button>
            <button class="category-btn" onclick="setCategory('knock-knock')">Knock-Knock</button>
        </div>

        <div class="error" id="error"></div>

        <div class="joke-box">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading your joke...</p>
            </div>
            <div id="joke-container" style="display: none;">
                <div class="joke-text" id="joke-text">Click the button to get a joke!</div>
                <div class="joke-punchline" id="joke-punchline" style="display: none;"></div>
                <div class="joke-type" id="joke-type"></div>
            </div>
        </div>

        <div class="button-group">
            <button class="get-joke-btn" id="getJokeBtn" onclick="fetchJoke()">Get Joke</button>
            <button class="random-btn" onclick="fetchRandomJoke()">Random</button>
            <button class="copy-btn" onclick="copyJoke()">Copy</button>
        </div>

        <div class="success-message" id="successMessage">✓ Joke copied to clipboard!</div>
    </div>

    <script>
        let currentJoke = {
            setup: '',
            delivery: '',
            type: '',
            category: ''
        };
        let selectedCategory = 'any';

        // Fetch joke from external API
        async function fetchJoke() {
            const getJokeBtn = document.getElementById('getJokeBtn');
            const loading = document.getElementById('loading');
            const jokeContainer = document.getElementById('joke-container');
            const error = document.getElementById('error');

            getJokeBtn.disabled = true;
            loading.style.display = 'block';
            jokeContainer.style.display = 'none';
            error.style.display = 'none';

            try {
                let url = 'https://v2.jokeapi.dev/joke/';
                
                if (selectedCategory === 'any') {
                    url += 'Any?type=single,twopart';
                } else if (selectedCategory === 'general') {
                    url += 'General';
                } else if (selectedCategory === 'programming') {
                    url += 'Programming';
                } else if (selectedCategory === 'knock-knock') {
                    url += 'Knock-Knock';
                }

                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error('No jokes available for this category');
                }

                // Handle both single and two-part jokes
                if (data.type === 'single') {
                    currentJoke = {
                        setup: data.joke,
                        delivery: '',
                        type: 'Single',
                        category: data.category
                    };
                } else {
                    currentJoke = {
                        setup: data.setup,
                        delivery: data.delivery,
                        type: 'Two-part',
                        category: data.category
                    };
                }

                displayJoke();
                jokeContainer.style.display = 'block';
                error.style.display = 'none';

            } catch (err) {
                console.error('Error fetching joke:', err);
                error.textContent = `Error: ${err.message}`;
                error.style.display = 'block';
                jokeContainer.style.display = 'none';
            } finally {
                loading.style.display = 'none';
                getJokeBtn.disabled = false;
            }
        }

        // Fetch random joke (same as get joke for this API)
        async function fetchRandomJoke() {
            await fetchJoke();
        }

        // Display joke in the UI
        function displayJoke() {
            const jokeText = document.getElementById('joke-text');
            const jokePunchline = document.getElementById('joke-punchline');
            const jokeType = document.getElementById('joke-type');

            jokeText.textContent = currentJoke.setup;

            if (currentJoke.delivery) {
                jokePunchline.textContent = currentJoke.delivery;
                jokePunchline.style.display = 'block';
            } else {
                jokePunchline.style.display = 'none';
            }

            jokeType.textContent = `${currentJoke.type} • ${currentJoke.category}`;
        }

        // Copy joke to clipboard
        function copyJoke() {
            const fullJoke = currentJoke.delivery 
                ? `${currentJoke.setup}\n${currentJoke.delivery}`
                : currentJoke.setup;

            navigator.clipboard.writeText(fullJoke).then(() => {
                const successMessage = document.getElementById('successMessage');
                successMessage.style.display = 'block';
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy joke');
            });
        }

        // Set category
        function setCategory(category) {
            selectedCategory = category;

            // Update active button
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }

        // Fetch joke on page load
        window.addEventListener('load', () => {
            fetchJoke();
        });

        // Allow Enter key to fetch joke
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                fetchJoke();
            }
        });
    </script>
</body>
</html>
